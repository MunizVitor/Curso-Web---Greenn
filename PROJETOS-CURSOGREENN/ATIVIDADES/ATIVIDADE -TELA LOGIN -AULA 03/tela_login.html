<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <style>
        body{
            margin: 25px;
            padding: 50px;
            background-color: rgba(112, 112, 112, 0.144);
            font-family: Arial, sans-serif;
        }
        img{
            width: 150px;
            height: 140px;
            border-radius: 50%;
        }

        #form{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
        }
        #quadrado{
            background-color: rgba(252, 252, 252, 0.973);
            box-shadow: 3px 2px 0px rgba(0, 0, 0, 0.267);
            height: 220px;
            width: 300px;
            border: 1px solid black;
            padding: 20px;
            border-radius: 10px;
        }
        
        #formulario {
            margin-top: 35px;
            margin-bottom: 10px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #formulario label {
            color: black;
            text-align: left;
            font-size: 15px;
            margin-bottom: 5px;
            width: 290px;
        }

        #formulario input {
            width: 290px;
            padding: 5px;
            height: 20px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.281);
            border: 1px solid rgba(0, 0, 0, 0.384);
            margin-bottom: 15px;
            margin-top: 5px;
        }

        #formulario button {
            margin-top: 5px;
            border: 1px solid rgba(0, 0, 0, 0.384);
            border-radius: 8px;
            color: white;
            width: 303px;
            padding: 0px;
            height: 35px;
            background-color: rgb(0, 112, 74);
        }

        h6{
            margin: 0;
            text-align: center;
            color: black;
            font-size: 10px;
            margin-top: 10px;
            margin-bottom: 50px;
        }

        .footer {
        background-color: rgb(0, 112, 74);
        text-align: center;
        padding: 10px;
        color: white;
        position: fixed;
        width: 100%;
        }
    </style>
</head>
<body>
    <header style="height: 200px; padding: 20px; margin-bottom: 20px;">
        <div style="text-align: center;">

            <img style="align-items: center;" src="/PROJETOS-CURSOGREENN/ATIVIDADES/ATIVIDADE -TELA LOGIN -AULA 03/img/login_marca.jpg" alt="Marca do Sistema"/>
            
            <h2>Seja Bem-vindo!</h2>
            <h3>Login</h3>
        </div>
    </header>
    <main>
    <div id="form">
        <div id="quadrado">
            <div id="formulario">
                <form action="" method="post">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Digite seu email" required>

                <label for="password">Password:</label>
                <input type="password" name="password" id="password" placeholder="Digite sua senha" required>

                <button id="entrar" onclick="location.href='entrar.html';" type="submit">Entrar</button>
                </form>
            </div>
        </div>
    </div>
    <h6><a href="#">Esqueceu sua senha?</a> <a href="/PROJETOS-CURSOGREENN/ATIVIDADES/ATIVIDADE -TELA LOGIN -AULA 03/criar_conta.html">Criar Conta</a></h6>
    </main>
    <footer>
        <div class="footer">
            <p>© Vitor Muniz</p>
        </div>
    </footer>
</body>
</html>
